services:
  storesprite-fe:
    build:
      context: .
      dockerfile: ./storesprite-fe/Dockerfile
    container_name: storesprite-fe
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./storesprite-fe:/workspace
      - ./packages:/packages
      # node_modules + dist stay inside the container (anonymous volumes),
      # never written back to the host bind mount. The FE only consumes
      # @storesprite/mapping-rules from the shared packages.
      - /workspace/node_modules
      - /workspace/dist
      - /packages/mapping-rules/node_modules
      - /packages/mapping-rules/dist
    depends_on:
      - storesprite-be
    networks:
      - storesprite-net

  storesprite-be:
    build:
      context: .
      dockerfile: ./storesprite-be/Dockerfile
    container_name: storesprite-be
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./storesprite-be:/workspace/storesprite-be
      - ./packages:/workspace/packages
      - ./stocksprite:/workspace/stocksprite
      # Expose the repo-root .dockerignore so the on-demand worker build (context
      # /workspace, dockerfile stocksprite/Dockerfile) excludes node_modules/dist.
      - ./.dockerignore:/workspace/.dockerignore:ro
      # node_modules + dist stay inside the container (anonymous volumes),
      # never written back to the host bind mount.
      - /workspace/storesprite-be/node_modules
      - /workspace/storesprite-be/dist
      - /workspace/packages/app-config/node_modules
      - /workspace/packages/app-config/dist
      - /workspace/packages/unas-json-client/node_modules
      - /workspace/packages/unas-json-client/dist
      - /workspace/packages/mapping-rules/node_modules
      - /workspace/packages/mapping-rules/dist
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - stocksprite-worker
    environment:
      - DATABASE_URL=postgresql://storesprite:storesprite_secure_pass@postgres:5432/storesprite_db
      - PGHOST=postgres
      - PGUSER=storesprite
      - PGPASSWORD=storesprite_secure_pass
      - PGDATABASE=storesprite_db
      - PGPORT=5432
      - CLERK_SECRET_KEY=sk_test_betoW7FNs6IwHbjTgibXzIPyU7e2VzHWcyGsS8NhV0
      - NODE_ENV=dev
      - INTERNAL_DRIVER=docker
      - INTERNAL_TOKEN=storesprite-internal-worker-secret-token
      - INTERNAL_BACKEND_URL=http://storesprite-be:3000
      - STOCKSPRITE_IMAGE=stocksprite-worker-dev
    networks:
      - storesprite-net

  # Pre-builds the combined worker image the backend spawns through the mounted
  # docker.sock, tagged stocksprite-worker-dev to mark it as the compose/dev build (a
  # production deploy builds/tags its own storesprite-worker:latest instead).
  # storesprite-be points STOCKSPRITE_IMAGE at this tag. Building when the stack comes up
  # means a connection test / mapping run never triggers a lazy mid-request build (whose
  # BuildKit token fetch to Docker Hub can fail behind TLS-intercepting proxies). Compose
  # builds the tag in its build phase whenever it is absent; this throwaway container then
  # exits 0. Refresh after worker changes with: docker compose build stocksprite-worker
  stocksprite-worker:
    image: stocksprite-worker-dev
    build:
      context: .
      dockerfile: ./stocksprite/Dockerfile
    restart: "no"
    command: ["echo", "stocksprite-worker-dev image built"]
    networks:
      - storesprite-net

  stocksprite-dev:
    build:
      context: .
      dockerfile: ./stocksprite/Dockerfile.dev
    container_name: stocksprite-dev
    restart: always
    volumes:
      - ./stocksprite:/workspace/stocksprite
      - ./packages:/workspace/packages
      # Expose the repo-root .dockerignore so docker builds whose context is
      # /workspace (e.g. the downloader integration test) exclude node_modules/dist.
      - ./.dockerignore:/workspace/.dockerignore:ro
      # node_modules + dist stay inside the container (anonymous volumes),
      # never written back to the host bind mount.
      - /workspace/stocksprite/downloader/node_modules
      - /workspace/stocksprite/downloader/dist
      - /workspace/stocksprite/processor/node_modules
      - /workspace/stocksprite/processor/dist
      - /workspace/packages/app-config/node_modules
      - /workspace/packages/app-config/dist
      - /workspace/packages/mapping-rules/node_modules
      - /workspace/packages/mapping-rules/dist
      - /workspace/packages/unas-json-client/node_modules
      - /workspace/packages/unas-json-client/dist
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - storesprite-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=storesprite
      - POSTGRES_PASSWORD=storesprite_secure_pass
      - POSTGRES_DB=storesprite_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - storesprite-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@storesprite.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_SERVER_JSON_FILE=/etc/pgadmin/servers.json
    volumes:
      - ./.docker/pgadmin/servers.json:/etc/pgadmin/servers.json:ro
      - ./.docker/pgadmin/pgpass:/pgpass
    depends_on:
      - postgres
    networks:
      - storesprite-net

networks:
  storesprite-net:
    name: storesprite-shared-net

volumes:
  postgres-data: