services:
  storesprite-fe:
    build:
      context: ./storesprite-fe
    container_name: storesprite-fe
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./storesprite-fe:/workspace
      - /workspace/node_modules
    depends_on:
      - storesprite-be
    networks:
      - storesprite-net

  storesprite-be:
    build:
      context: ./storesprite-be
    container_name: storesprite-be
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./storesprite-be:/workspace
      - /workspace/node_modules
    depends_on:
      - opensearch
      - postgres
    environment:
      - DATABASE_URL=postgresql://storesprite:storesprite_secure_pass@postgres:5432/storesprite_db
      - PGHOST=postgres
      - PGUSER=storesprite
      - PGPASSWORD=storesprite_secure_pass
      - PGDATABASE=storesprite_db
      - PGPORT=5432
      - CLERK_SECRET_KEY=sk_test_betoW7FNs6IwHbjTgibXzIPyU7e2VzHWcyGsS8NhV0
    networks:
      - storesprite-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=storesprite
      - POSTGRES_PASSWORD=storesprite_secure_pass
      - POSTGRES_DB=storesprite_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - storesprite-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@storesprite.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_SERVER_JSON_FILE=/etc/pgadmin/servers.json
    volumes:
      - ./.docker/pgadmin/servers.json:/etc/pgadmin/servers.json:ro
      - ./.docker/pgadmin/pgpass:/pgpass
    depends_on:
      - postgres
    networks:
      - storesprite-net

  opensearch:
    image: opensearchproject/opensearch:3.1.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Connecticut4847!
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200" # OpenSearch REST API
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - storesprite-net

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.1.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch      
    networks:
      - storesprite-net

networks:
  storesprite-net:
    name: storesprite-shared-net

volumes:
  opensearch-data:
  postgres-data: