services:
  mock-backend:
    image: wiremock/wiremock:latest
    container_name: mock-backend
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/__admin/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 1s
    networks:
      - storesprite-e2e-net

  mock-datasource-server:
    build:
      context: ./mock-datasource-server
      dockerfile: Dockerfile
    container_name: mock-datasource-server
    ports:
      - "8088:80"
      - "2224:22"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/public/feed_public_comma.csv || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 1s
    networks:
      - storesprite-e2e-net

networks:
  storesprite-e2e-net:
    name: storesprite-e2e-net
    driver: bridge
