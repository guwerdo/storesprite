services:
  mock-backend:
    # Mappings are baked into the image (./wiremock/Dockerfile) rather than bind-
    # mounted: this harness is run from inside the stocksprite-dev container, and
    # bind sources are resolved by the HOST engine in its own namespace — a
    # /workspace/... source would mount an empty dir there. Baked files work from
    # host or container alike (the build context is streamed client-side).
    build:
      context: ./wiremock
      dockerfile: Dockerfile
    container_name: mock-backend
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/__admin/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 1s
    networks:
      - storesprite-integration-net

  mock-datasource-server:
    build:
      context: ./mock-datasource-server
      dockerfile: Dockerfile
    container_name: mock-datasource-server
    ports:
      - "8088:80"
      - "2224:22"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/public/feed_public_comma.csv || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 1s
    networks:
      - storesprite-integration-net

networks:
  storesprite-integration-net:
    name: storesprite-integration-net
    driver: bridge
