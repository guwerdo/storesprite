events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  text/plain;
    sendfile      on;

    server {
        listen 80;
        root /var/www/supplier;

        # 1. Public endpoints (No auth required)
        location /public/ {
            try_files $uri =404;
        }

        # 2. Bearer Token Auth
        location /bearer/ {
            if ($http_authorization != "Bearer mock_bearer_token_123") {
                return 401 '{"error":"Unauthorized: Invalid Bearer Token"}';
            }
            try_files $uri =404;
        }

        # 3. Custom Header API Key Auth
        location /apikey/ {
            if ($http_x_supplier_api_key != "mock_api_key_456") {
                return 403 '{"error":"Forbidden: Invalid API Key"}';
            }
            try_files $uri =404;
        }

        # 4. Basic Auth
        location /basic/ {
            auth_basic "Supplier Protected Area";
            auth_basic_user_file /etc/nginx/.htpasswd;
            try_files $uri =404;
        }
    }
}
