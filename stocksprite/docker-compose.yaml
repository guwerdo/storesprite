services:
  redis-stack:
    image: redis/redis-stack:7.4.0-v6
    container_name: redis-stack
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--appendonly yes

  app:
    build:
      context: ./containers/app
    container_name: app
    restart: always
    depends_on:
      - redis-stack
    environment:
      - REDIS_HOST=redis-stack
      - REDIS_PORT=6379
      - TZ=Europe/Budapest
    command: top
    volumes:
      - ./app:/app
      - ./app/logs:/app/logs
      - ./app/test-data:/app/dist/test-data
      - ./app/secrets:/run/secrets:ro
      - csv-provider-data:/csv-provider-data:ro

  opensearch:
    image: opensearchproject/opensearch:3.1.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Connecticut4847!
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200" # OpenSearch REST API
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.1.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch

  fluentbit:
    image: fluent/fluent-bit:4.0.3
    container_name: fluentbit
    depends_on:
      - opensearch
    volumes:
      - ./containers/fluentbit/fluentbit.conf:/fluentbit/fluentbit.conf:ro
      - ./containers/fluentbit/parsers.conf:/fluentbit/parsers.conf:ro
      - ./app/logs:/var/log/stocksprite:ro
      - fluentbit-data:/fluentbit-data
    command: ["-c", "/fluentbit/fluentbit.conf"]

  csv-provider:
    build:
      context: ./containers/csv-provider
    container_name: csv-provider
    volumes:
      - csv-provider-data:/csv-provider-data

  test-csv-server:
    image: nginx:stable-alpine3.21
    container_name: test-csv-server
    ports:
      - "8080:80"
    volumes:
      - ./containers/test-csv-server/csv-server.conf:/etc/nginx/conf.d/csv-server.conf:ro
      - ./containers/test-csv-server/unas-ezermesterszerszam.csv:/usr/share/nginx/html/unas-ezermesterszerszam.csv:ro

volumes:
  opensearch-data:
  fluentbit-data:
  redis-data:
  csv-provider-data:
